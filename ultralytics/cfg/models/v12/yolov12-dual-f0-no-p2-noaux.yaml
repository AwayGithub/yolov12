# YOLOv12-MF-F0: Dual-Stream RGB-IR Mid-Fusion baseline without P2 neck/head and without P3 aux
# This is the original dual-stream mid-fusion reference for stepwise ablation:
# - no P2 fusion / no P2 detection head
# - no P3 auxiliary head (disabled at train time with --disable_aux_head)
# - P4 uses A2C2f as the backbone/neck reference block

nc: 3           # smoke, fire, person
ch: 6           # dual-stream input (RGB + IR)
dual_stream: true

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

# Shared dual-stream backbone: identical to yolov12-dual.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv,   [128, 3, 2, 1, 2]]    # 1-P2/4
  - [-1, 2, C3k2,   [256, False, 0.25]]   # 2
  - [-1, 1, Conv,   [256, 3, 2, 1, 4]]    # 3-P3/8
  - [-1, 2, C3k2,   [512, False, 0.25]]   # 4 ← P3 fusion point
  - [-1, 1, Conv,   [512, 3, 2]]          # 5-P4/16
  - [-1, 4, A2C2f,  [512, True, 4]]       # 6 ← P4 fusion point
  - [-1, 1, Conv,   [1024, 3, 2]]         # 7-P5/32
  - [-1, 4, A2C2f,  [1024, True, 1]]      # 8 ← P5 fusion point

# Shared neck + head: P3/P4/P5 only, no P2 branch/head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]             # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]      # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]             # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]      # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]            # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]]      # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]             # cat head P5
  - [-1, 2, C3k2, [1024, True]]           # 20

  - [[14, 17, 20], 1, Detect, [nc]]       # Detect(P3, P4, P5)
