# C6.5 fusion hierarchy on the YOLOv12n backbone for fire/person.
# P2 DMGInit8d + P3 CFRA/FreDFT + P4/P5 RS-SQF match C65-y8n-backbone-fire-person.yaml.

nc: 2
ch: 6
dual_stream: true

p2_fusion: dmg_init8d
dmg_diff_hidden_ratio: 0.25
dmg_alpha_init: 1.0
dmg_beta_init: -0.1
freq_fusion_stages: [p3]
fredft_expansion: 3.0
fredft_qkv_expand: 1.0
fredft_checkpoint_ffn: true
rssqf_fusion_stages: [p4, p5]
rssqf_hidden_ratio: 0.5
rssqf_num_heads: 8
rssqf_num_queries_p4: 12
rssqf_num_queries_p5: 8
rssqf_topk_p4: 8
rssqf_topk_p5: 6
rssqf_gamma_init: 0.0
rssqf_redundancy_gamma_init: 0.0

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[17, 20, 23, 26], 1, Detect, [nc]]
