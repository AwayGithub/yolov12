# MCDet reproduction on a YOLOv5n-size dual-stream fire/person detector.
# The original paper uses YOLOv5s and data augmentation; this fair local baseline uses YOLOv5n and no augmentation.

nc: 2
ch: 6
dual_stream: true

mcdet_fusion_stages: [p3, p4, p5]
mcdet_cgan: true

scales:
  n: [0.33, 0.25, 1024]

# YOLOv5 v6.0 backbone
backbone:
  - [-1, 1, Conv, [64, 6, 2, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3, [256]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 9, C3, [512]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3, [1024]]
  - [-1, 1, SPPF, [1024, 5]]

# YOLOv5 v6.0 FPN/PAN head with CGAN inserted after concat layers by the MCDet wrapper.
head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]

  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C3, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]

  - [[17, 20, 23], 1, Detect, [nc]]
